[General]
loglevel = warning
show-error-page-for-reject = true
skip-proxy = %APPEND%, 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32, ::1/128, ::/128, ::ffff:0:0/96, 64:ff9b::/96, 100::/64, 2001::/32, 2001:10::/28, 2001:20::/28, 2001:db8::/32, 2002::/16, fc00::/7, fe80::/10, fec0::/10, ff00::/8
test-timeout = 3
proxy-test-url = http://www.gstatic.com/generate_204
internet-test-url = http://wifi.vivo.com.cn/generate_204
geoip-maxmind-url = https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip/release/Country-without-asn.mmdb
exclude-simple-hostnames = true
allow-wifi-access = false
allow-hotspot-access = false
udp-policy-not-supported-behaviour = REJECT
wifi-access-http-port = 6152
# http-listen = 0.0.0.0:6152
# socks5-listen = 0.0.0.0:6153
wifi-access-socks5-port = 6153
all-hybrid = true
ipv6 = false
ipv6-vif = auto
encrypted-dns-follow-outbound-mode = true
dns-server = 223.5.5.5, 223.6.6.6, 2400:3200::1, 2400:3200:baba::1
encrypted-dns-server = quic://dns.alidns.com, h3://dns.alidns.com/dns-query
hijack-dns = *:53, *:853, *:8853
read-etc-hosts = true
use-local-host-item-for-proxy = true
http-api-tls = true
http-api-web-dashboard = true
block-quic = all
proxy-test-udp = apple.com@1.0.0.1
compatibility-mode = 5

[Proxy Group]
Sub_Store = select, policy-path=https://sub.store/download/collection/Sub?target=Surge, update-interval=43200, hidden=1, icon-url=B1::Transport::Airplane Take Off, no-alert=0, include-all-proxies=0
百度直连 = select, policy-path=https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Surge/BaiduProxy.conf, update-interval=604800, no-alert=0, hidden=1, include-all-proxies=0, icon-url=B1::Food::Sugar Free
Groups = select, DIRECT, 香港, 台湾, 狮城, 日本, 美国, no-alert=0, hidden=1, include-all-proxies=0, icon-url=B1::Photo and Video::Normal Screen
Location = select, DIRECT, 江苏, 广东, 北京, no-alert=0, hidden=0, include-all-proxies=0, icon-url=B1::Maps::Location(7)
Domestic = select, include-other-group=Groups, icon-url=B1::Ecommerce::Home Address
Emby = select, include-other-group=Groups, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Emby.png
Youtube = select, include-other-group=Groups, icon-url=B1::Logos::YouTube
OpenAi = select, include-other-group=Groups, icon-url=B1::Logos::ChatGPT
Telegram = select, include-other-group=Groups, icon-url=B1::Logos::Telegram App
Google = select, include-other-group=Groups, icon-url=B1::Logos::Google
Cloudflare = select, include-other-group=Groups, icon-url=B1::Network::Cloud Done
Github = select, include-other-group=Groups, icon-url=B1::Logos::GitHub
Microsoft = select, include-other-group=Groups, icon-url=B1::Logos::Microsoft Office Add Ins
Apple = select, include-other-group=Groups, icon-url=B1::Logos::Apple Logo
Foreign = select, include-other-group=Groups, icon-url=B1::Maps::Earth Globe
Final = select, include-other-group=Groups, icon-url=B1::User Interface::Final State
香港 = smart, policy-regex-filter=🇭🇰|(?i)HK|香港, hidden=1, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png, no-alert=0, include-other-group=Sub_Store, persistent=0, include-all-proxies=0
台湾 = smart, policy-regex-filter=🇹🇼|🇼🇸|🇨🇳|(?i)TW|台湾, hidden=1, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png, no-alert=0, include-other-group=Sub_Store, include-all-proxies=0
狮城 = smart, policy-regex-filter=🇸🇬|(?i)SG|狮城, hidden=1, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png, no-alert=0, include-other-group=Sub_Store, include-all-proxies=0
日本 = smart, policy-regex-filter=🇯🇵|(?i)JP|日本, hidden=1, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png, no-alert=0, include-other-group=Sub_Store, include-all-proxies=0
美国 = smart, policy-regex-filter=🇺🇸|(?i)US|美国, hidden=1, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png, no-alert=0, include-other-group=Sub_Store, include-all-proxies=0
江苏 = smart, policy-regex-filter=南京|苏州, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=百度直连, icon-url=B1::Household::Light Bulb
广东 = smart, policy-regex-filter=广州, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=百度直连, icon-url=B1::Household::Light Off
北京 = smart, policy-regex-filter=北京|保定, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=百度直连, icon-url=B1::Industry::Searchlight

[Rule]
AND,((PROTOCOL,QUIC), (NOT,((DEST-PORT,"53,853,8853")))),REJECT-DROP
AND,((OR,((IP-CIDR,0.0.0.0/8,no-resolve), (IP-CIDR,224.0.0.0/4,no-resolve))), (USER-AGENT,Telegram)),REJECT
# 自定义规则
RULE-SET,https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Surge/rule/Reject/Reject.list,REJECT,pre-matching,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Surge/rule/Direct/Direct.list,DIRECT,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Surge/rule/Proxy/Proxy.list,Foreign,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Surge/rule/Emby/Emby.list,Emby,"update-interval=604800"
# 局域网
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Lan/Lan.list,DIRECT,"update-interval=604800"
# 广告
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/BlockHttpDNS/BlockHttpDNS.list,REJECT-DROP,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/TG-Twilight/AWAvenue-Ads-Rule@main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list,REJECT-DROP,pre-matching,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Advertising/Advertising_All_No_Resolve.list,REJECT-DROP,pre-matching,"update-interval=604800"
# 国内网站
RULE-SET,https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Surge/rule/FakeLocation/FakeLocation.list,Location,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/China/China_All_No_Resolve.list,Domestic,"update-interval=604800"
# 国外媒体
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/YouTube/YouTube.list,Youtube,"update-interval=604800" // Youtube
# 国外网站
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Telegram/Telegram.list,Telegram,"update-interval=604800",no-resolve
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/OpenAI/OpenAI.list,OpenAi,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Google/Google.list,Google,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/GitHub/GitHub.list,Github,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Microsoft/Microsoft.list,Microsoft,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Apple/Apple_All_No_Resolve.list,Apple,"update-interval=604800"
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Proxy/Proxy_All_No_Resolve.list,Foreign,"update-interval=604800"
# 最终规则
FINAL,Final,dns-failed

[Host]
