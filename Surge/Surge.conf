iosapps.itunes.apple.com = iosapps.itunes.apple.com.download.ks-cdn.com
iosapps.itunes.apple.com = iosapps.itunes.apple.com.mwcname.com
testflight.apple.com = server:h3://cloudflare-dns.com/dns-query
api.twitter.com = 2604:4700:4700::1111

[URL Rewrite]
^https?://(www.)?(g|google).cn https://www.google.com 302
# Redirect Google Search Service
^(http|https):\/\/(www.)?(g|google)\.cn https://www.google.com 302
^https?://(.*?[.])?(?:g|google).cn https://$1google.com 302
# Redirect Google Maps Service
^(http|https):\/\/(ditu|maps).google\.cn https://maps.google.com 302
# Weibo Short URL
^http:\/\/t\.cn http://sinaurl.cn 302

[Header Rewrite]
http-request githubusercontent.com header-replace Accept-Language en-us
http-request ^https?://([^/]+\.)?baidu\.com/.* header-add Host 153.3.236.22:443
http-request ^https?://([^/]+\.)?baidu\.com/.* header-add X-T5-Auth 683556433
http-request ^https?://([^/]+\.)?baidu\.com/.* header-add Connection Keep-Alive
http-request ^https?://([^/]+\.)?baidu\.com/.* header-add User-Agent okhttp/3.11.0

