# 代理集锚点
代理订阅: &Proxyer
  type: http
  interval: 86400
  exclude-filter: '(?i)(?:套餐|官网|官方|网址|售后|过期|剩余|到期|流量|更新|重置|免流|使用|教程)'
  health-check:
    enable: true
    url: "https://captive.apple.com"
    interval: 300
  header:
    User-Agent:
      - "clash.meta"
      - "mihomo"
      
免流混淆: &host
  override-expr:
    - .servername = "m.youku.com"
    - .sni = .servername
    - (select(.network == "ws") | .["ws-opts"].headers.Host) = .servername
    - (select(.network == "http") | .["http-opts"].headers.Host) = [.servername]
    - (select(.network == "h2") | .["h2-opts"].headers.Host) = [.servername]
    - (select(.network == "xhttp") | .["xhttp-opts"].headers.Host) = .servername

# 代理集
proxy-providers:
  Sub:
    <<: *Proxyer
    path: ./proxies/Sub.yaml
    url: "http://127.0.0.1:3000/download/collection/Sub?target=ClashMeta"
  VPS:
    <<: *Proxyer
    path: ./proxies/VPS.yaml
    url: "http://127.0.0.1:3000/download/VPS?target=ClashMeta"
  Best:
    <<: *Proxyer
    path: ./proxies/Free.yaml
    url: "http://127.0.0.1:3000/download/Best?target=ClashMeta"
    override:
      <<: *host

# 出站代理
proxies:
  - name: 🟢 直连
    type: direct
    udp: true
  - name: 🚫 拒绝
    type: reject
  - name: ⭕️ DNS_Hijack
    type: dns

# 代理组锚点
智能节点地区组: &Smartp
  type: smart
  include-all-providers: true
  policy-priority: '(?:^|[^0-9.])0\.\d+(?:[^0-9.]|$):1.5'
  uselightgbm: true
  collectdata: false
  prefer-asn: true
  lazy: false
  hidden: true

软件分流组: &Groupp
  type: select
  proxies:
    - 🟢 直连
    - 香港
    - 狮城
    - 日本
    - 美国
    - 其他
  hidden: false

# 代理组
proxy-groups:
  - name: Domestic
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Domestic.png"
  - name: Emby
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Emby.png"
  - name: Ai
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png"
  - name: Telegram
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png"
  - name: Cloudflare
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Cloudflare.png"
  - name: Google
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png"
  - name: Github
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/GitHub.png"
  - name: Microsoft
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png"
  - name: Apple
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png"
  - name: Foreign
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  - name: Final
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png"
  - name: 香港
    <<: *Smartp
    filter: '(?i)(?:香港|🇭🇰|HK|Hong\s?Kong)'
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"
  - name: 狮城
    <<: *Smartp
    filter: '(?i)(?:新加坡|🇸🇬|SG|Singapore)'
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png"
  - name: 日本
    <<: *Smartp
    filter: '(?i)(?:日本|🇯🇵|JP|Japan)'
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png"
  - name: 美国
    <<: *Smartp
    filter: '(?i)(?:美国|🇺🇸|US|States|America)'
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png"
  - name: 其他
    <<: *Smartp
    exclude-filter: '(?i)(?:VPS|hkv|香港|🇭🇰|HK|Hong\s?Kong|新加坡|🇸🇬|SG|Singapore|日本|🇯🇵|JP|Japan|美国|🇺🇸|US|States|America)'
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png"

# 规则集锚点
rule-anchor:
  域名规则集: &dom
    type: http
    behavior: domain
    format: mrs
    interval: 86400
  ip规则集: &ipc
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400

