Sub1Url: &Sub1Url "http://127.0.0.1:3000/download/collection/Sub?target=ClashMeta"
Sub2Url: &Sub2Url "http://127.0.0.1:3000/download/VPS?target=ClashMeta"

ProxyTest: &ProxyTest "https://captive.apple.com"

FilterVPS: &FilterVPS '(?i)(?:VPS|hkv)'
FilterHK: &FilterHK '(?i)(?:香港|🇭🇰|HK|Hong\s?Kong)'
FilterSG: &FilterSG '(?i)(?:新加坡|🇸🇬|SG|Singapore)'
FilterJP: &FilterJP '(?i)(?:日本|🇯🇵|JP|Japan)'
FilterUS: &FilterUS '(?i)(?:美国|🇺🇸|US|States|America)'
ExFilter: &ExFilter '(?i)(?:套餐|官网|官方|网址|售后|过期|剩余|到期|流量|更新|重置|免流|使用|教程|址|优惠|推广|AFF)'

Proxyer: &Proxyer
  type: http
  interval: 86400
  exclude-filter: *ExFilter
  health-check:
    enable: true
    url: *ProxyTest
    interval: 600
  header:
    User-Agent:
    - "clash.meta"
    - "mihomo"

Smartp: &Smartp
  type: smart
  include-all-providers: true
  policy-priority: '(?<![\d.])0\.\d+(?!\d):1.5'
  uselightgbm: true
  collectdata: false
  prefer-asn: true
  url: *ProxyTest
  hidden: true

Groupp: &Groupp
  type: select
  proxies:
  - 🟢 直连
  - 自由
  - 香港
  - 狮城
  - 日本
  - 美国
  url: *ProxyTest
  hidden: false

rule-anchor:
  dom: &dom
    type: http
    behavior: domain
    format: mrs
    interval: 86400
  ipc: &ipc
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400

listeners:
  - name: ebpf-in
    type: ebpf
    mode: hybrid
    network:
    - tcp
    - udp
    udp-timeout: 300
    dns-mode: hijack
    bypass-private-address: true
    bypass-rule-set:
    - cn_ip
    tcp-splice: true
    local:
      cgroup-path: ""
      ipv6-mode: auto
      include-package: []
      exclude-package: []
    shared:
      interface:
      - "wlan0"
      - "ap0"
      ipv6-mode: always
      advanced:
        tc-priority: 1

proxies:
- name: 🟢 直连
  type: direct
  udp: true
- name: 🚫 拒绝
  type: reject
- name: ⭕️ DNS_Hijack
  type: dns

proxy-providers:
  Sub1:
    <<: *Proxyer
    path: ./proxies/Sub1.yaml
    url: *Sub1Url
  Sub2:
    <<: *Proxyer
    path: ./proxies/Sub2.yaml
    url: *Sub2Url

