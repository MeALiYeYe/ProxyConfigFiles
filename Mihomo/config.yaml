# 路由规则
rules:
  - DST-PORT,123,🟢 直连
  - DST-PORT,5228-5230,🟢 直连
  - RULE-SET,ntp,🟢 直连
  - RULE-SET,googlefcm,🟢 直连
  - RULE-SET,private,🟢 直连
  - RULE-SET,private_ip,🟢 直连,no-resolve
  - RULE-SET,ads-all,🚫 拒绝
  - RULE-SET,awavenue,🚫 拒绝
  - RULE-SET,rejects,🚫 拒绝
  - RULE-SET,rejects_ip,🚫 拒绝,no-resolve
  - RULE-SET,directs,Domestic
  - RULE-SET,directs_ip,Domestic,no-resolve
  - RULE-SET,proxys,Foreign
  - RULE-SET,proxys_ip,Foreign,no-resolve
  - RULE-SET,cn,Domestic
  - RULE-SET,cn_ip,Domestic,no-resolve
  - RULE-SET,emby,Emby
  - RULE-SET,ai-chat-!cn,Ai
  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,google,Google
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,cloudflare,Cloudflare
  - RULE-SET,cloudflare_ip,Cloudflare,no-resolve
  - RULE-SET,github,Github
  - RULE-SET,apple,Apple
  - RULE-SET,apple_ip,Apple,no-resolve
  - RULE-SET,microsoft,Microsoft
  - RULE-SET,geolocation-!cn,Foreign
  - MATCH,Final

# 全局设置
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
ipv6: true
mode: rule
log-level: error
unified-delay: true
tcp-concurrent: true
allow-lan: true
external-controller: 0.0.0.0:9090
external-ui: ./dist/
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/gh-pages-no-fonts.zip"
skip-auth-prefixes:
  - 10.0.0.0/8
  - 127.0.0.0/8
  - 192.168.0.0/16

geo-auto-update: true
geo-update-interval: 168
geox-url:
  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

lgbm-auto-update: true
lgbm-update-interval: 360
lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"

profile:
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 100

# 域名嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 5228-5230
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "miwifi.com"

# 入栈监听
listeners:
  - name: ebpf-in
    type: ebpf
    network:
      - tcp
      - udp
    udp-timeout: 120
    bypass-rule-set:
      - cn_ip
    local:
      enabled: true
      data-plane: cgroup
      dns-mode: hijack
      ipv6: true
      bypass-private-address: true
      include-package: []
      exclude-package: []
    shared:
      enabled: true
      data-plane: packet_rewrite
      interface:
        - wlan0
        - ap0
        - rndis0
        - br-lan
      dns-mode: hijack
      ipv6: true
      bypass-private-address: false

# tunnel虚拟网卡
tun:
  enable: false
  device: Mihomo
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  auto-detect-interface: true
  strict-route: true

# DNS
dns:
  enable: true
  listen: :1053
  cache-algorithm: arc
  ipv6: true
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdfe:dcba:9876::/64
  fake-ip-filter:
    - "RULE-SET:private"
    - "RULE-SET:googlefcm"
    - "RULE-SET:ntp"
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.captive.apple.com"
  cndoh: &cndoh
    - 'quic://dns.alidns.com'
    - 'https://dns.alidns.com/dns-query'
  cgdoh: &cgdoh
    - 'https://dns.google/dns-query#Google'
    - 'https://cloudflare-dns.com/dns-query#Cloudflare'
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
    - '2400:3200::1'
    - '2400:3200:baba::1'
  proxy-server-nameserver: *cndoh
  nameserver-policy:
    '.eu.cc': *cgdoh
    'RULE-SET:ads-all,awavenue,rejects': rcode://success
    'RULE-SET:cn,apple,microsoft,directs': *cndoh
    'RULE-SET:geolocation-!cn,proxys': *cgdoh
  nameserver: *cndoh