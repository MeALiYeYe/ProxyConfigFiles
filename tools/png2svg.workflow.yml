name: Sync Icons & Convert SVG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout self
        uses: actions/checkout@v5

      # ✅ 拉取 Koolson 图标（sparse）
      - name: Fetch Koolson Icons
        run: |
          rm -rf icon/Koolson

          git clone --depth=1 --filter=blob:none --sparse https://github.com/Koolson/Qure.git koolson
          cd koolson
          git sparse-checkout set IconSet/Color

          mkdir -p ../icon/Koolson
          cp -r IconSet/Color/* ../icon/Koolson/

          cd ..
          rm -rf koolson

      # ✅ 安装工具
      # 旧方案是 imagemagick + potrace：`convert -threshold 70%` 会先把图二值化，
      # 颜色信息在追踪之前就已经丢失，且透明圆角外沿会被填成一整块黑色矩形。
      # 换成 vtracer（颜色感知的 hierarchical 聚类）+ scour（SVG 压缩）。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install vtracer pillow scour

      # ✅ 转换（保持目录结构）
      - name: Convert PNG to SVG
        run: |
          python tools/png2svg.py \
            --colormode color \
            --hierarchical stacked \
            --mode spline \
            --upscale auto \
            --filter-speckle 4 \
            --color-precision 7 \
            --layer-difference 12 \
            --corner-threshold 60 \
            --path-precision 2 \
            --bg white \
            $(find icon -type f -name '*.png' | sort)

      # ✅ 清理孤儿 SVG（PNG 被删掉时同步删除对应 SVG）
      - name: Clean up orphan SVGs
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path('icon')
          pngs = {p.with_suffix('').as_posix() for p in root.rglob('*.png')}
          svgs = {p.with_suffix('').as_posix() for p in root.rglob('*.svg')}
          for o in sorted((pathlib.Path(s + '.svg') for s in svgs - pngs), key=str):
              print('remove', o)
              o.unlink()
          PY

      # ✅ 提交
      - name: Commit & Push
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add icon
            git commit -m "sync koolson icons & convert svg (vtracer)"
            git push
          else
            echo "No changes"
          fi
