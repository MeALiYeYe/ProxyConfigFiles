name: Sync Icons & Convert SVG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      # ✅ 拉取 Koolson 图标（sparse）
      - name: Fetch Koolson Icons
        run: |
          rm -rf icon/Koolson

          git clone --depth=1 --filter=blob:none --sparse https://github.com/Koolson/Qure.git koolson
          cd koolson
          git sparse-checkout set IconSet/Color

          mkdir -p ../icon/Koolson
          cp -r IconSet/Color/* ../icon/Koolson/

          cd ..
          rm -rf koolson

      # ✅ 安装工具
      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y imagemagick potrace

      # ✅ 转换（保持目录结构）
      - name: Convert PNG to SVG
        run: |
          find icon -type f -name "*.png" | while read file; do
            svg="${file%.png}.svg"
            pgm="${file%.png}.pgm"

            convert "$file" -threshold 70% "$pgm"
            potrace "$pgm" -s -o "$svg"
            rm "$pgm"

            echo "Converted $file"
          done

      # ✅ 提交
      - name: Commit & Push
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            git add icon
            git commit -m "sync koolson icons & convert svg"
            git push
          else
            echo "No changes"
          fi
