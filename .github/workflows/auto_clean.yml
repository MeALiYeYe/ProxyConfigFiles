# SPDX-License-Identifier: MIT

name: Clean Workflow Runs (No External Action)

on:
  # 每月执行
  schedule:
    - cron: 0 0 1 * *
  workflow_dispatch:

permissions:
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old workflow runs
        run: |
          echo "== Clean workflow runs =="

          # 保留天数（改这里）
          KEEP_DAYS=1

          # 计算时间阈值（ISO8601）
          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +"%Y-%m-%dT%H:%M:%SZ")
          echo "Delete runs older than: $CUTOFF"

          PAGE=1

          while true; do
            echo "== Fetch page $PAGE =="

            RUNS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&page=$PAGE" \
              --jq ".workflow_runs[] | select(.created_at < \"$CUTOFF\") | .id")

            # 没有更多了就退出
            if [ -z "$RUNS" ]; then
              echo "No more runs to delete."
              break
            fi

            for id in $RUNS; do
              echo "Deleting run $id"
              gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
              sleep 0.2
            done

            PAGE=$((PAGE+1))
          done
